# Render Blueprint: one web service (dashboard + scheduler) on the FREE plan.
#
# Free plan limits (see DEPLOY_RENDER.md):
#   * it sleeps after 15 minutes without inbound traffic; while asleep nothing is sent.
#     start.py pings its own RENDER_EXTERNAL_URL every 9 minutes to stay awake
#     (KEEP_ALIVE_MINUTES, 0 = off).
# This file is only read by a Render Blueprint. A web service created by hand
# (DEPLOY_RENDER.md) needs the same settings entered in the Render form.
#   * no persistent disk: the database, queue, history and dashboard edits are lost on
#     every restart, redeploy or sleep. Friends and sources survive through
#     SCHEDULES_B64 and the Instagram login through IG_SESSION_B64.
# For an always-on service that keeps its data, use plan: starter and add back a disk:
#     disk: {name: reeldrop-data, mountPath: /app/data, sizeGB: 1}
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the
# variables marked "sync: false" (secrets are never stored in this file).
# Redeploys: Render's GitHub connection redeploys automatically on every push to `branch`.
# To deploy only after the GitHub Actions CI passes, change this to `checksPass`.
services:
  - type: web
    name: reeldrop
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    region: singapore            # closest Render region to India
    branch: render-deploy       # the deploy branch; push here to redeploy
    autoDeployTrigger: commit
    healthCheckPath: /_stcore/health
    envVars:
      # Safe default: prints instead of sending. Change to instagrapi (real Instagram DMs)
      # in the Render dashboard only after the dashboard opens and dry-run works.
      - key: SENDER
        value: dry_run
      - key: TZ_NAME
        value: Asia/Kolkata
      - key: SCHEDULES_PATH
        value: /app/data/schedules.yaml
      - key: SHUTDOWN_GRACE_SECONDS
        value: "240"
      - key: DASHBOARD_PASSWORD
        sync: false
      # Route D (Telegram) - recommended on a cloud host
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_FRIEND_CHAT_ID
        sync: false
      - key: TELEGRAM_MY_CHAT_ID
        sync: false
      - key: TELEGRAM_CONTROL
        value: "0"
      # Route B (instagrapi, real Instagram DMs). Cloud IPs get more Instagram security
      # checks: set IG_TOTP_SECRET, and if the login still fails upload a session file in
      # the dashboard (Settings -> Instagram login).
      - key: IG_USERNAME
        sync: false
      - key: IG_PASSWORD
        sync: false
      - key: IG_TOTP_SECRET          # base32 two-factor setup key; the login needs it
        sync: false
      - key: IG_VERIFICATION_CODE    # optional one-time code
        sync: false
      - key: IG_SESSION_B64          # base64 of a working data/session.json (free plan)
        sync: false
      - key: SCHEDULES_B64           # base64 of your schedules.yaml (friends stay private)
        sync: false
      - key: STORAGE_IS_EPHEMERAL    # makes the dashboard warn that edits do not survive
        value: "1"
      - key: IG_LINK_FALLBACK        # 0 = send the actual reel or nothing; 1 = link if that fails
        value: "0"
      - key: LOGIN_RETRY_MINUTES     # wait after a failed Instagram login before retrying
        value: "60"
      # Route A (official API)
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_RECIPIENT_IGSID
        sync: false
